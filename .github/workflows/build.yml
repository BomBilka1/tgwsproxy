name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install . pyinstaller==6.13.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller packaging/windows.spec --noconfirm
      - name: Prepare download
        shell: pwsh
        run: |
          Move-Item dist/TgWsProxy.exe dist/TgWsProxy_windows.exe
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item README.md dist/README.txt
          $hash = (Get-FileHash dist/TgWsProxy_windows.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TgWsProxy_windows.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-Windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TgWsProxy-Windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "TG WS Proxy BomBilka $RELEASE_TAG" --generate-notes
